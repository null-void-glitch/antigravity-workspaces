<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Avatar Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0221;
            --card-bg: rgba(26, 11, 46, 0.7);
            --neon-magenta: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-purple: #9d00ff;
            --text-main: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(157, 0, 255, 0.1) 0%, transparent 60%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
        }

        .container {
            position: relative;
            padding: 3rem;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(157, 0, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.05);
            text-align: center;
            max-width: 500px;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple));
            z-index: -1;
            border-radius: 22px;
            opacity: 0.3;
            filter: blur(5px);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .avatar-frame {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border: 4px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            cursor: crosshair;
            transition: transform 0.3s ease;
        }

        .avatar-frame:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
            border-color: var(--neon-magenta);
        }

        .avatar-frame img {
            image-rendering: pixelated;
            width: 100%;
            height: 100%;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.4;
        }

        .info {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            border-radius: 4px;
            color: var(--neon-cyan);
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 5px;
        }

        /* Background Glitch Effects */
        .glitch-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .glitch-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(0, 255, 255, 0.1);
            animation: glitch-anim 4s infinite linear;
        }

        @keyframes glitch-anim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>
    <div class="glitch-bg">
        <div class="glitch-line" style="animation-delay: 0s;"></div>
        <div class="glitch-line" style="animation-delay: 1.2s;"></div>
        <div class="glitch-line" style="animation-delay: 2.5s;"></div>
    </div>

    <div class="container">
        <h1>Protocol: Cyber-Girl</h1>
        <div class="avatar-frame">
            <img src="avatar_transparent.png" alt="Static Pixel Avatar">
            <div class="scanlines"></div>
        </div>
        <div class="info">
            <p>Subject: Hacker_v.2.04</p>
            <p>Status: <span style="color: #00ff00;">ONLINE (ENJOYING COFFEE)</span></p>
            <div>
                <span class="tag">200x200px</span>
                <span class="tag">Cyberpunk</span>
                <span class="tag">Pixel-Art</span>
            </div>
        </div>
    </div>
</body>
</html>
